<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logbook Login</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#007bff">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/live.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background-color: #007bff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2em;
            font-weight: bold;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .demo-links {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .demo-links a {
            display: block;
            margin-bottom: 5px;
            color: #007bff;
            text-decoration: none;
        }
        .demo-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-placeholder" aria-hidden="true">LB</div>
        <h1>Clinical Skills Logbook</h1>
        <p id="login-intro">Sign in with your institution email</p>

        <p id="login-msg" role="alert" hidden></p>

        <form class="login-form" id="signin-form" novalidate>
            <label class="visually-hidden" for="username">Email</label>
            <input type="email" id="username" autocomplete="username" placeholder="Email" required>
            <label class="visually-hidden" for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <form class="login-form" id="challenge-form" hidden novalidate>
            <label class="visually-hidden" for="challenge-input" id="challenge-label">Answer</label>
            <input id="challenge-input" required>
            <input type="password" id="challenge-confirm" autocomplete="new-password" placeholder="Repeat new password" hidden>
            <button type="submit" class="btn btn-primary" id="challenge-btn">Continue</button>
        </form>

        <div class="demo-links" id="demo-links" hidden>
            <p><strong>Demo Shortcuts</strong> (no backend configured):</p>
            <a href="student_dashboard_locked.html">Login as Student (New)</a>
            <a href="student_pwa_dashboard.html">Login as Student (Active)</a>
            <a href="lecturer_dashboard.html">Login as Lecturer</a>
            <a href="admin_dashboard.html">Login as Administrator</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
    (function () {
        const L = window.Logbook;
        const msg = document.getElementById('login-msg');
        const signinForm = document.getElementById('signin-form');
        const challengeForm = document.getElementById('challenge-form');
        const challengeInput = document.getElementById('challenge-input');
        const confirmInput = document.getElementById('challenge-confirm');
        let challenge = null;

        if (!L.configured) {
            document.getElementById('demo-links').hidden = false;
            signinForm.addEventListener('submit', (e) => {
                e.preventDefault();
                L.notice(msg, 'No backend is configured yet, so use a demo shortcut below.', 'info');
            });
            return;
        }

        const existing = L.session();
        if (existing && existing.user.exp * 1000 > Date.now()) window.location.replace(L.afterSignIn(existing.user));

        function busy(form, on) {
            const b = form.querySelector('button');
            b.disabled = on;
            b.dataset.label = b.dataset.label || b.textContent;
            b.textContent = on ? 'Please wait…' : b.dataset.label;
        }

        function done(result) {
            if (result.session) { window.location.replace(L.afterSignIn(result.session.user)); return; }
            challenge = result.challenge;
            signinForm.hidden = true;
            challengeForm.hidden = false;
            challengeInput.value = '';
            confirmInput.value = '';
            if (challenge.name === 'NEW_PASSWORD_REQUIRED') {
                document.getElementById('login-intro').textContent = 'Choose a new password (at least 10 characters, with upper- and lower-case letters and a number).';
                challengeInput.type = 'password';
                challengeInput.autocomplete = 'new-password';
                challengeInput.placeholder = 'New password';
                confirmInput.hidden = false;
                document.getElementById('challenge-btn').textContent = 'Set password and sign in';
            } else if (challenge.name === 'SOFTWARE_TOKEN_MFA') {
                document.getElementById('login-intro').textContent = 'Enter the 6-digit code from your authenticator app.';
                challengeInput.type = 'text';
                challengeInput.inputMode = 'numeric';
                challengeInput.autocomplete = 'one-time-code';
                challengeInput.placeholder = '6-digit code';
                confirmInput.hidden = true;
                document.getElementById('challenge-btn').textContent = 'Verify';
            } else {
                L.notice(msg, 'This account needs a sign-in step this page does not support yet. Contact your administrator.');
                return;
            }
            challengeInput.focus();
        }

        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            L.notice(msg, '');
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return L.notice(msg, 'Enter your email and password.');
            busy(signinForm, true);
            try { done(await L.signIn(email, password)); }
            catch (err) { L.notice(msg, err.message); }
            finally { busy(signinForm, false); }
        });

        challengeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            L.notice(msg, '');
            const answer = challengeInput.value.trim();
            if (!answer) return;
            if (challenge.name === 'NEW_PASSWORD_REQUIRED' && answer !== confirmInput.value.trim())
                return L.notice(msg, 'The two passwords do not match.');
            busy(challengeForm, true);
            try { done(await L.answerChallenge(challenge, answer)); }
            catch (err) { L.notice(msg, err.message); }
            finally { busy(challengeForm, false); }
        });
    })();
    </script>

</body>
</html>
