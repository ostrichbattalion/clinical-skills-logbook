<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logbook Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background-color: #007bff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2em;
            font-weight: bold;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .demo-links {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .demo-links a {
            display: block;
            margin-bottom: 5px;
            color: #007bff;
            text-decoration: none;
        }
        .demo-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-placeholder">LB</div>
        <h1>Student Logbook</h1>
        <p>Please sign in to continue</p>

        <form class="login-form" onsubmit="handleLogin(event)">
            <input type="text" id="username" placeholder="Student ID or Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="demo-links">
            <p><strong>Demo Shortcuts:</strong></p>
            <a href="student_dashboard_locked.html">Login as Student (New)</a>
            <a href="student_pwa_dashboard.html">Login as Student (Active)</a>
            <a href="lecturer_dashboard.html">Login as Lecturer</a>
            <a href="admin_dashboard.html">Login as Administrator</a>
        </div>
    </div>

    <script> // Changed login script
    function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('username').value.toLowerCase();
        
        if (username.includes('admin')) {
            window.location.href = 'admin_dashboard.html';
        } else if (username.includes('lecturer')) {
            window.location.href = 'lecturer_dashboard.html';
        } else {
            // FIX: Changed filename to match the actual file
            window.location.href = 'student_dashboard_locked.html'; 
        }
    }
    </script>

</body>
</html>
