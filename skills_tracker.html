<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Progress</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/live.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <a href="student_pwa_dashboard.html" id="back" class="btn btn-link" style="margin: 0; width: auto;">&larr; Back</a>
            <div style="text-align: right; font-size: 0.9em; color: #666;">
                <strong>Overall:</strong> <span id="overall">…</span><br><span id="met"></span>
            </div>
        </div>
        <h1>Skills Progress <span id="who" class="sub-details"></span></h1>
        <div class="tracker-filters view-tabs" id="view-tabs" hidden>
            <button class="filter-btn" data-view="year" aria-pressed="false">College: this year</button>
            <button class="filter-btn" data-view="total" aria-pressed="false">College: to graduation</button>
            <button class="filter-btn" data-view="hpcsa" aria-pressed="false">HPCSA Annexure A</button>
        </div>
        <p id="framework-note"></p>
        <p id="tracker-msg" role="alert" hidden></p>
        <div class="tracker-filters">
            <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-btn" data-filter="progress" aria-pressed="false">In Progress</button>
            <button class="filter-btn" data-filter="notstarted" aria-pressed="false">Not Started</button>
            <button class="filter-btn" data-filter="met" aria-pressed="false">Met</button>
            <button class="filter-btn" data-filter="paeds" aria-pressed="false">Paediatric</button>
            <button class="filter-btn" data-filter="record" aria-pressed="false" hidden>Medications</button>
        </div>
        <p><input type="checkbox" id="show-zero"> <label for="show-zero" style="display:inline">Show skills with no minimum here</label></p>
        <div class="achievements-grid" id="grid"><p class="empty">Loading…</p></div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/skills-tracker.js"></script>
</body>
</html>
