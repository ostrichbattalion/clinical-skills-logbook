<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Sign-Off</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Lecturer Skill Sign-Off</h1>
        <p>You are confirming that you directly observed <strong>Jane Doe</strong> performing the following skills. Please uncheck any skills you did <strong>not</strong> witness.</p>

        <div class="encounter-group">
            <h3>🩸 Circulation (IV Cannulation)</h3>
            <ul class="skill-list">
                <li><input type="checkbox" id="s1" checked><label for="s1">Competent</label></li>
            </ul>
        </div>

        <!-- Lecturer Details Form -->
        <form action="student_pwa_dashboard.html">
            <div>
                <label for="lecturer-name">Lecturer Full Name</label>
                <input type="text" id="lecturer-name" name="lecturer-name" placeholder="e.g., Dr. B. Jones" required>
            </div>
            <div>
                <label for="lecturer-reg">Professional Reg. Number</label>
                <input type="text" id="lecturer-reg" name="lecturer-reg" placeholder="e.g., PC-12345" required>
            </div>
            <div>
                <label for="comments">Optional Comments</label>
                <textarea id="comments" name="comments" placeholder="Any observations or notes..." rows="3"></textarea>
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Confirm & Sign-Off</button>
            </div>
        </form>
    </div>
</body>
</html>
