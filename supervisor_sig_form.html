<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review &amp; Sign</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/live.css">
</head>
<body>
    <div class="container">
        <a href="lecturer_dashboard.html" class="btn btn-link">&larr; Back to Queue</a>
        <h1>Digital Signature</h1>
        <p>You are signing off for <strong id="student-name">…</strong>. Untick any skill you did not witness; it will be recorded as not witnessed and will not count.</p>
        <p id="sign-msg" role="alert" hidden></p>

        <div class="encounter-group">
            <h3 id="entry-title">Loading…</h3>
            <p id="entry-notes" class="sub-details" hidden></p>
            <ul class="skill-list skill-checklist" id="skill-list"></ul>
        </div>

        <form id="sign-form" hidden novalidate>
            <div class="field">
                <label for="signer-name">Your full name</label>
                <input type="text" id="signer-name" readonly>
                <div class="hint">From your logbook account.</div>
            </div>
            <div class="field">
                <label for="reg-code">Your professional registration number</label>
                <input type="text" id="reg-code" maxlength="40" placeholder="e.g. PA1234567" required>
            </div>
            <div class="field">
                <label for="comment">Comment for the student (optional)</label>
                <textarea id="comment" rows="2" maxlength="500"></textarea>
            </div>
            <div class="field">
                <input type="checkbox" id="attest">
                <label for="attest" style="display:inline;font-weight:normal">I personally witnessed the ticked skills being performed by this student on actual patients.</label>
            </div>
            <button type="submit" class="btn btn-approve">Sign &amp; Approve Ticked Skills</button>
        </form>

        <div id="return-section" hidden style="margin-top:30px;border-top:2px solid #eee;padding-top:20px">
            <h3>Something wrong with this entry?</h3>
            <form id="return-form" novalidate>
                <div class="field">
                    <label for="return-reason">Reason for returning it to the student</label>
                    <input type="text" id="return-reason" maxlength="500" placeholder="e.g. I wasn't on shift that day">
                </div>
                <button type="submit" class="btn btn-reject">Return to Student</button>
            </form>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sign-entry.js"></script>
</body>
</html>
