<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Signature</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Supervisor Digital Signature</h1>
        <p>You are signing off on encounters for <strong>Jane Doe</strong>. Please review the skills below and uncheck any you did not witness.</p>
        
        <div class="encounter-group">
            <h3>Encounter: Patient #123 (Ambulance)</h3>
            <ul class="skill-list">
                <li><input type="checkbox" id="s1" checked><label for="s1">Clinical assessment</label></li>
                <li><input type="checkbox" id="s2" checked><label for="s2">Vital Signs</label></li>
                <li><input type="checkbox" id="s3" checked><label for="s3">IV Insertion</label></li>
            </ul>
        </div>
        
        <div class="encounter-group">
            <h3>Encounter: Skills @ Triage Desk</h3>
            <ul class="skill-list">
                <li><input type="checkbox" id="s4" checked><label for="s4">Clinical assessment</label></li>
                <li><input type="checkbox" id="s5" checked><label for="s5">Vital Signs</label></li>
                <li><input type="checkbox" id="s6" checked><label for="s6">History Taking</label></li>
            </ul>
        </div>

        <form action="student_pwa_dashboard.html">
            <div>
                <label for="supervisor-name">Your Full Name</label>
                <input type="text" id="supervisor-name" name="supervisor-name" placeholder="e.g., B. Jones">
            </div>
            <div>
                <label for="reg-code">Your Professional Reg. Code</label>
                <input type="text" id="reg-code" name="reg-code" placeholder="e.g., PC-12345">
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Sign & Approve Selected Skills</button>
            </div>
        </form>
    </div>
</body>
</html>
