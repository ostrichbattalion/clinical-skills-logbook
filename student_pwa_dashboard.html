<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/live.css">
</head>
<body>
    <div class="container">
        <p id="dash-msg" role="status" hidden></p>

        <div class="log-options">
            <a href="log_new_encounter.html" class="btn btn-primary" style="font-size: 1.1em;">+ Log Patient Encounter</a>
            <a href="log_single_skill.html" class="btn btn-primary" style="font-size: 1.1em;">+ Log Single Skill</a>
        </div>
        <div class="dashboard-utils" style="margin-bottom: 20px;">
            <a href="skills_tracker.html" class="btn btn-secondary">🏆 View Progress Against HPCSA Minimums</a>
        </div>

        <div class="pending-list">
            <h2>Pending Signatures (<span id="pending-count">…</span>)</h2>
            <p>Select the entries you want a supervisor or lecturer to sign.</p>
            <ul class="entry-list" id="pending-list"><li class="empty">Loading…</li></ul>
        </div>

        <div style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px;">
            <button type="button" class="btn btn-approve" id="request-btn" disabled>Select entries to request a signature</button>
            <a href="paper_flow.html" class="btn btn-link">...or submit a paper form</a>
        </div>

        <h2>⏳ Awaiting Signature</h2>
        <ul class="entry-list" id="awaiting-list"></ul>

        <div class="completed-list">
            <h2>✅ Recently Signed</h2>
            <ul class="entry-list" id="signed-list"></ul>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/student-dashboard.js"></script>
</body>
</html>
